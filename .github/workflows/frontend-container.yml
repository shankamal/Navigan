name: Frontend container and Fargate templates
on:
  push:
    paths: ['frontend/**', 'infrastructure/frontend/**', 'infrastructure/auth/**', 'scripts/frontend/**', '.github/workflows/frontend-container.yml']
  pull_request:
    paths: ['frontend/**', 'infrastructure/frontend/**', 'infrastructure/auth/**', 'scripts/frontend/**', '.github/workflows/frontend-container.yml']
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint boto3==1.40.30 PyYAML==6.0.2
      - run: cfn-lint infrastructure/frontend/ecr.yaml infrastructure/frontend/service.yaml infrastructure/auth/template.yaml
      - run: for script in scripts/frontend/*.sh; do bash -n "$script"; done
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        run: |
          docker buildx build --load --platform linux/amd64 --tag navigan-frontend:ci frontend
      - name: Verify identical image with DEV and PROD fixture settings
        run: python scripts/verify-frontend-artifact.py --image navigan-frontend:ci
      - name: Test container startup, health and page routing
        run: |
          docker run --detach --name frontend-ci --publish 127.0.0.1:3000:3000 navigan-frontend:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz; then break; fi
            sleep 2
          done
          curl --fail --show-error http://127.0.0.1:3000/healthz
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/login
          IMAGE_USER="$(docker image inspect navigan-frontend:ci --format '{{.Config.User}}')"
          test -n "$IMAGE_USER"
          test "$IMAGE_USER" != "0"
          test "$IMAGE_USER" != "root"
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs frontend-ci || true
          docker rm --force frontend-ci || true
