name: Python and PostgreSQL verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: navigan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/navigan_test
      MIGRATION_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/navigan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python scripts/migrate.py
      - run: python scripts/migrate.py
      - run: pytest -q
      - run: python scripts/generate_openapi.py
      - run: git diff --exit-code docs/openapi.json
      - run: ruff check src tests scripts --select E9,F63,F7,F82
