apiVersion: apps/v1
kind: Deployment
metadata:
  name: retailflow-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: retailflow-api}
  template:
    metadata:
      labels:
        app: retailflow-api
        tier: application
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: retailflow-api
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels: {app: retailflow-api}
      initContainers:
        - name: wait-for-data-services
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z postgres 5432 && nc -z redis 6379; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10005
            capabilities: {drop: ["ALL"]}
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python", "/app/server.py"]
          envFrom:
            - configMapRef:
                name: retailflow-settings
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: source, mountPath: /app, readOnly: true}
            - {name: secret, mountPath: /var/run/secrets/retailflow, readOnly: true}
            - {name: tmp, mountPath: /tmp}
        - name: heartbeat-sidecar
          image: busybox:1.37
          command: ["sh", "-c", "while true; do date -u; sleep 30; done"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 25m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: source
          configMap:
            name: retailflow-api-source
            defaultMode: 0444
        - name: secret
          secret:
            secretName: retailflow-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: retailflow-api
spec:
  selector: {app: retailflow-api}
  sessionAffinity: ClientIP
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: retailflow-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: retailflow-api
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
