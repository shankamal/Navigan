apiVersion: v1
kind: ConfigMap
metadata:
  name: retailflow-settings
data:
  APP_ENV: retailflow
  API_MESSAGE: RetailFlow order-management application
  FEATURE_BACKGROUND_JOBS: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: retailflow-api-source
data:
  server.py: |
    import json
    import os
    import socket
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    def tcp_status(host, port):
        try:
            with socket.create_connection((host, port), timeout=1):
                return "reachable"
        except OSError as error:
            return f"unreachable:{type(error).__name__}"

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                payload, status = {"status": "healthy"}, 200
            elif self.path == "/readyz":
                dependencies = {
                    "postgres": tcp_status("postgres", 5432),
                    "redis": tcp_status("redis", 6379),
                }
                ready = all(value == "reachable" for value in dependencies.values())
                payload, status = {"ready": ready, "dependencies": dependencies}, 200 if ready else 503
            else:
                payload, status = {
                    "message": os.getenv("API_MESSAGE"),
                    "environment": os.getenv("APP_ENV"),
                    "pod": socket.gethostname(),
                    "dependencies": {
                        "postgres": tcp_status("postgres", 5432),
                        "redis": tcp_status("redis", 6379),
                    },
                        "secretMounted": os.path.exists("/var/run/secrets/retailflow/API_TOKEN"),
                }, 200
            body = json.dumps(payload).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: retailflow-nginx
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /healthz {
        access_log off;
        return 200 "healthy\n";
      }

      location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://retailflow-api:8080/;
      }

      location / {
        default_type text/html;
        return 200 '<html><body><h1>RetailFlow</h1><p>Order-management application running on self-managed Kubernetes.</p><p>Use <a href="/api/">/api/</a> to inspect service dependencies.</p></body></html>';
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: retailflow-secrets
type: Opaque
stringData:
  API_TOKEN: replace-before-non-lab-use
  POSTGRES_USER: reference
  POSTGRES_PASSWORD: replace-before-non-lab-use
  POSTGRES_DB: reference
