apiVersion: apps/v1
kind: Deployment
metadata:
  name: retailflow-frontend
spec:
  replicas: 2
  selector:
    matchLabels: {app: retailflow-frontend}
  template:
    metadata:
      labels:
        app: retailflow-frontend
        tier: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: retailflow-frontend}
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: retailflow-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: retailflow-frontend
spec:
  selector: {app: retailflow-frontend}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retailflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - retailflow.navigan.click
      secretName: retailflow-tls
  rules:
    - host: retailflow.navigan.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: retailflow-frontend
                port:
                  name: http
