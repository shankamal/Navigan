apiVersion: batch/v1
kind: Job
metadata:
  name: reference-connectivity-check
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: reference-connectivity-check
        tier: diagnostics
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: curlimages/curl:8.16.0
          command:
            - sh
            - -c
            - |
              set -eu
              nslookup reference-api
              nslookup postgres
              nslookup redis
              curl --fail --show-error http://reference-api:8080/readyz
              curl --fail --show-error http://reference-frontend/healthz
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reference-periodic-check
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: reference-periodic-check
            tier: diagnostics
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: curlimages/curl:8.16.0
              command: ["curl", "--fail", "--show-error", "http://reference-api:8080/readyz"]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 50m, memory: 32Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: {drop: ["ALL"]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reference-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: reference-api}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reference-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: reference-frontend}
