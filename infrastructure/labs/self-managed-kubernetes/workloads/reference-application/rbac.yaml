apiVersion: v1
kind: ServiceAccount
metadata:
  name: retailflow-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: retailflow-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: retailflow-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: retailflow-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: retailflow-reader
subjects:
  - kind: ServiceAccount
    name: retailflow-operator
    namespace: retailflow
