apiVersion: v1
kind: ConfigMap
metadata:
  name: retailflow-web
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <meta name="theme-color" content="#101912">
      <title>RetailFlow</title>
      <link rel="stylesheet" href="/styles.css">
    </head>
    <body>
      <header class="topbar">
        <a class="brand" href="/"><span class="brand-mark">R</span><span>RetailFlow</span></a>
        <nav>
          <button class="nav-link active" data-view="catalog">Catalogue</button>
          <button class="nav-link" data-view="orders">Orders</button>
          <button class="cart-button" id="cartButton">Cart <span id="cartCount">0</span></button>
        </nav>
      </header>

      <main>
        <section class="hero">
          <div>
            <span class="eyebrow">RETAIL OPERATIONS</span>
            <h1>Products customers love.<br><em>Operations teams trust.</em></h1>
            <p>Browse inventory, create orders and observe a distributed application running on self-managed Kubernetes.</p>
          </div>
          <div class="system-card">
            <div class="system-heading"><span class="live-dot"></span> Platform live</div>
            <div class="metric"><span>PostgreSQL</span><strong id="postgresStatus">Checking</strong></div>
            <div class="metric"><span>Redis</span><strong id="redisStatus">Checking</strong></div>
            <div class="metric"><span>API pod</span><strong id="podName">Checking</strong></div>
          </div>
        </section>

        <section id="catalogView">
          <div class="section-heading">
            <div><span class="eyebrow">LIVE INVENTORY</span><h2>Product catalogue</h2></div>
            <div class="filters">
              <input id="searchInput" type="search" placeholder="Search products">
              <select id="categoryFilter"><option value="">All categories</option></select>
            </div>
          </div>
          <div class="product-grid" id="productGrid"></div>
        </section>

        <section id="ordersView" class="hidden">
          <div class="section-heading">
            <div><span class="eyebrow">ORDER ACTIVITY</span><h2>Recent orders</h2></div>
          </div>
          <div id="ordersList" class="orders-list"></div>
        </section>
      </main>

      <aside class="drawer" id="cartDrawer">
        <div class="drawer-header"><h2>Your cart</h2><button id="closeCart" aria-label="Close">×</button></div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-footer">
          <label>Customer name<input id="customerName" value="Navigan Demo"></label>
          <div class="total"><span>Total</span><strong id="cartTotal">$0.00</strong></div>
          <button class="primary" id="placeOrder">Place order</button>
          <p id="orderMessage"></p>
        </div>
      </aside>
      <div class="backdrop" id="backdrop"></div>
      <script src="/app.js"></script>
    </body>
    </html>

  styles.css: |
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#172019;background:#f3f6f1;line-height:1.5}
    *{box-sizing:border-box}body{margin:0}.topbar{height:72px;background:#0e1711;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,32px);position:sticky;top:0;z-index:10}
    .brand{display:flex;gap:12px;align-items:center;color:white;text-decoration:none;font-size:20px;font-weight:750}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#83c51b;color:#102008}
    nav{display:flex;align-items:center;gap:10px}.nav-link,.cart-button{border:0;background:transparent;color:#cfd8d1;padding:10px 14px;border-radius:9px;font:inherit;cursor:pointer}.nav-link.active{background:#1b2a20;color:#fff}.cart-button{background:#83c51b;color:#102008;font-weight:700}.cart-button span{background:#102008;color:#fff;border-radius:999px;padding:2px 7px;margin-left:5px}
    main{max-width:1240px;margin:auto;padding:46px 28px 80px}.hero{display:grid;grid-template-columns:1.5fr .7fr;gap:54px;align-items:center;padding:48px 0 64px}.eyebrow{font-size:12px;letter-spacing:.17em;color:#54810d;font-weight:800}
    h1{font-size:clamp(40px,5vw,70px);line-height:1.02;letter-spacing:-.045em;margin:16px 0 22px}h1 em{font-style:normal;color:#619810}.hero p{max-width:670px;font-size:18px;color:#617066}
    .system-card{background:#fff;border:1px solid #dce5da;border-radius:18px;padding:24px;box-shadow:0 18px 50px rgba(24,43,28,.08)}.system-heading{font-weight:750;padding-bottom:15px;border-bottom:1px solid #e5ebe3}.live-dot{display:inline-block;width:9px;height:9px;background:#7fbe19;border-radius:50%;box-shadow:0 0 0 5px #edf7df;margin-right:9px}
    .metric{display:flex;justify-content:space-between;padding-top:16px;color:#68766c}.metric strong{color:#315d0c;font-size:13px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
    .section-heading{display:flex;align-items:end;justify-content:space-between;margin:20px 0 25px}.section-heading h2{font-size:32px;margin:6px 0 0}.filters{display:flex;gap:10px}.filters input,.filters select,.cart-footer input{padding:12px 14px;border:1px solid #ced8cc;border-radius:10px;background:#fff;font:inherit}
    .product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.product-card{background:#fff;border:1px solid #dce5da;border-radius:16px;overflow:hidden;transition:.2s}.product-card:hover{transform:translateY(-4px);box-shadow:0 18px 35px rgba(26,50,30,.09)}
    .product-visual{height:145px;display:grid;place-items:center;font-size:54px;background:linear-gradient(145deg,#edf5e8,#f8faf7)}.product-body{padding:20px}.category{color:#6c7a70;font-size:13px}.product-card h3{font-size:18px;margin:5px 0 18px}.product-footer{display:flex;align-items:center;justify-content:space-between}.price{font-size:22px;font-weight:800}.add-button{border:0;background:#16231a;color:#fff;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:700}
    .drawer{position:fixed;z-index:30;right:-440px;top:0;width:min(420px,100%);height:100vh;background:#fff;box-shadow:-24px 0 70px rgba(0,0,0,.2);transition:.25s;display:flex;flex-direction:column}.drawer.open{right:0}.drawer-header{display:flex;justify-content:space-between;align-items:center;padding:24px;border-bottom:1px solid #e4eae2}.drawer-header h2{margin:0}.drawer-header button{border:0;background:none;font-size:32px;cursor:pointer}
    .cart-items{padding:20px;overflow:auto;flex:1}.cart-line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:15px 0;border-bottom:1px solid #e5ebe3}.cart-line p{margin:0;color:#68766c}.quantity{display:flex;gap:9px;align-items:center}.quantity button{width:27px;height:27px;border:1px solid #cbd6c9;background:white;border-radius:7px;cursor:pointer}
    .cart-footer{padding:22px;border-top:1px solid #e4eae2}.cart-footer label{display:grid;gap:6px;font-size:13px}.total{display:flex;justify-content:space-between;font-size:20px;padding:20px 0}.primary{width:100%;padding:14px;border:0;border-radius:10px;background:#83c51b;color:#112008;font-weight:800;cursor:pointer}.primary:disabled{opacity:.5}.backdrop{position:fixed;inset:0;background:rgba(7,14,9,.45);z-index:20;opacity:0;pointer-events:none;transition:.2s}.backdrop.show{opacity:1;pointer-events:auto}
    .orders-list{display:grid;gap:14px}.order-card{background:#fff;border:1px solid #dce5da;border-radius:14px;padding:20px;display:grid;grid-template-columns:1fr auto}.order-card h3{margin:0 0 5px}.order-card p{margin:0;color:#69776d}.status{color:#5d930c;font-weight:750}.empty{padding:50px;text-align:center;background:#fff;border:1px dashed #bdcbbb;border-radius:15px;color:#68766c}.hidden{display:none}
    @media(max-width:850px){.hero{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,1fr)}.nav-link{display:none}.section-heading{align-items:start;gap:20px;flex-direction:column}.filters{width:100%}.filters input{flex:1}}
    @media(max-width:560px){main{padding:25px 18px 60px}.topbar{padding:0 18px}.product-grid{grid-template-columns:1fr}.hero{padding-top:25px;gap:25px}h1{font-size:43px}.filters{flex-direction:column}.order-card{grid-template-columns:1fr}}

  app.js: |
    const state={products:[],cart:{},orders:JSON.parse(localStorage.getItem("retailflow-orders")||"[]")};
    const icons={Audio:"🎧",Wearables:"⌚",Workspace:"⌨️",Accessories:"🔌"};
    const money=value=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(value);
    const byId=id=>document.getElementById(id);
    async function request(path,options={}){const response=await fetch(`/api${path}`,{headers:{"Content-Type":"application/json"},...options});const body=await response.json();if(!response.ok)throw new Error(body.error||"Request failed");return body}
    function renderProducts(){const term=byId("searchInput").value.toLowerCase();const category=byId("categoryFilter").value;const products=state.products.filter(p=>(!category||p.category===category)&&p.name.toLowerCase().includes(term));byId("productGrid").innerHTML=products.map(p=>`<article class="product-card"><div class="product-visual">${icons[p.category]||"📦"}</div><div class="product-body"><span class="category">${p.category} · ${p.stock} in stock</span><h3>${p.name}</h3><div class="product-footer"><span class="price">${money(p.price)}</span><button class="add-button" onclick="addToCart('${p.id}')">Add to cart</button></div></div></article>`).join("")}
    window.addToCart=id=>{state.cart[id]=(state.cart[id]||0)+1;renderCart();openCart()};window.adjust=(id,amount)=>{state.cart[id]=Math.max(0,(state.cart[id]||0)+amount);if(!state.cart[id])delete state.cart[id];renderCart()};
    function renderCart(){const entries=Object.entries(state.cart);byId("cartCount").textContent=entries.reduce((sum,[,q])=>sum+q,0);let total=0;byId("cartItems").innerHTML=entries.length?entries.map(([id,quantity])=>{const product=state.products.find(p=>p.id===id);total+=product.price*quantity;return `<div class="cart-line"><div><strong>${product.name}</strong><p>${money(product.price)}</p></div><div class="quantity"><button onclick="adjust('${id}',-1)">−</button><strong>${quantity}</strong><button onclick="adjust('${id}',1)">+</button></div></div>`}).join(""):`<div class="empty">Your cart is empty.</div>`;byId("cartTotal").textContent=money(total);byId("placeOrder").disabled=!entries.length}
    function renderOrders(){byId("ordersList").innerHTML=state.orders.length?state.orders.map(order=>`<article class="order-card"><div><h3>${order.id} · ${order.customer}</h3><p>${order.items.map(i=>`${i.quantity}× ${i.name}`).join(", ")}</p></div><div><strong>${money(order.total)}</strong><div class="status">${order.status}</div></div></article>`).join(""):`<div class="empty">No orders yet. Add products to the cart to create one.</div>`}
    function openCart(){byId("cartDrawer").classList.add("open");byId("backdrop").classList.add("show")}function closeCart(){byId("cartDrawer").classList.remove("open");byId("backdrop").classList.remove("show")}
    async function placeOrder(){const button=byId("placeOrder");button.disabled=true;button.textContent="Creating order…";try{const order=await request("/orders",{method:"POST",body:JSON.stringify({customer:byId("customerName").value,items:state.cart})});state.orders.unshift(order);localStorage.setItem("retailflow-orders",JSON.stringify(state.orders.slice(0,20)));state.cart={};renderCart();renderOrders();byId("orderMessage").textContent=`${order.id} created successfully`}catch(error){byId("orderMessage").textContent=error.message}finally{button.textContent="Place order";button.disabled=!Object.keys(state.cart).length}}
    async function init(){try{const [catalog,stats]=await Promise.all([request("/catalog"),request("/stats")]);state.products=catalog.products;const categories=[...new Set(state.products.map(p=>p.category))];byId("categoryFilter").innerHTML+=categories.map(c=>`<option>${c}</option>`).join("");byId("postgresStatus").textContent=stats.dependencies.postgres;byId("redisStatus").textContent=stats.dependencies.redis;byId("podName").textContent=stats.pod;renderProducts();renderCart();renderOrders()}catch(error){byId("productGrid").innerHTML=`<div class="empty">Unable to load catalogue: ${error.message}</div>`}}
    byId("searchInput").addEventListener("input",renderProducts);byId("categoryFilter").addEventListener("change",renderProducts);byId("cartButton").addEventListener("click",openCart);byId("closeCart").addEventListener("click",closeCart);byId("backdrop").addEventListener("click",closeCart);byId("placeOrder").addEventListener("click",placeOrder);
    document.querySelectorAll(".nav-link").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll(".nav-link").forEach(item=>item.classList.remove("active"));button.classList.add("active");byId("catalogView").classList.toggle("hidden",button.dataset.view!=="catalog");byId("ordersView").classList.toggle("hidden",button.dataset.view!=="orders")}));
    init();
