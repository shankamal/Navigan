AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Navigan Cluster Management API and asynchronous Terraform execution
Parameters:
  JwtScope: {Type: String, Default: navigan/api}
  DatabaseName: {Type: String}
  DatabaseProxyHost: {Type: String}
  ApiDatabaseSecretArn: {Type: String}
  SecretsKmsKeyArn: {Type: String}
  PrivateSubnetIds: {Type: List<AWS::EC2::Subnet::Id>}
  LambdaSecurityGroupIds: {Type: List<AWS::EC2::SecurityGroup::Id>}
  RdsCaLayerArn: {Type: String}
  ApiId: {Type: String}
  AuthorizerId: {Type: String}
  TerraformRunnerImageUri: {Type: String}
Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 30
    MemorySize: 256
    CodeUri: ../../../src/
    Layers: [!Ref RdsCaLayerArn]
    VpcConfig:
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds: !Ref LambdaSecurityGroupIds
    Environment:
      Variables:
        DB_PROXY_HOST: !Ref DatabaseProxyHost
        DB_NAME: !Ref DatabaseName
        DB_CA_BUNDLE: /opt/certs/global-bundle.pem
        DB_SECRET_ARN: !Ref ApiDatabaseSecretArn
        TERRAFORM_ARTIFACT_BUCKET: !Ref TerraformArtifacts
        TERRAFORM_STATE_KMS_KEY_ARN: !GetAtt TerraformStateKey.Arn
Resources:
  TerraformStateKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      Description: Navigan Terraform state and immutable plan artifacts
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: RootAdministration
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: 'kms:*'
            Resource: '*'
  TerraformArtifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt TerraformStateKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  TerraformArtifactsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformArtifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt TerraformArtifacts.Arn, !Sub '${TerraformArtifacts.Arn}/*']
            Condition: {Bool: {aws:SecureTransport: 'false'}}
  ClusterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: navigan.modules.cluster_management.handler.lambda_handler
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          TERRAFORM_CODEBUILD_PROJECT: !Ref TerraformProject
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref ApiDatabaseSecretArn
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Ref SecretsKmsKeyArn
            - Effect: Allow
              Action: [s3:GetObject,s3:PutObject]
              Resource: !Sub '${TerraformArtifacts.Arn}/*'
            - Effect: Allow
              Action: kms:GenerateDataKey
              Resource: !GetAtt TerraformStateKey.Arn
            - Effect: Allow
              Action: codebuild:StartBuild
              Resource: !GetAtt TerraformProject.Arn
  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: navigan.modules.cluster_management.status_handler.lambda_handler
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref ApiDatabaseSecretArn
            - Effect: Allow
              Action: kms:Decrypt
              Resource: [!Ref SecretsKmsKeyArn, !GetAtt TerraformStateKey.Arn]
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${TerraformArtifacts.Arn}/*'
  TerraformRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TerraformExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup,logs:CreateLogStream,logs:PutLogEvents]
                Resource: '*'
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken,ecr:BatchCheckLayerAvailability,ecr:GetDownloadUrlForLayer,ecr:BatchGetImage]
                Resource: '*'
              - Effect: Allow
                Action: [s3:GetObject,s3:PutObject,s3:ListBucket,s3:DeleteObject]
                Resource: [!GetAtt TerraformArtifacts.Arn, !Sub '${TerraformArtifacts.Arn}/*']
              - Effect: Allow
                Action: [kms:Decrypt,kms:Encrypt,kms:GenerateDataKey,kms:DescribeKey]
                Resource: [!GetAtt TerraformStateKey.Arn, !Ref SecretsKmsKeyArn]
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:navigan/provisioning/*'
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/NaviganProvisioningRole'
  TerraformProject:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt TerraformRole.Arn
      TimeoutInMinutes: 90
      QueuedTimeoutInMinutes: 30
      Artifacts: {Type: NO_ARTIFACTS}
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - /opt/venv/bin/python /app/runner.py
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref TerraformRunnerImageUri
        ImagePullCredentialsType: SERVICE_ROLE
        PrivilegedMode: false
        EnvironmentVariables:
          - {Name: TERRAFORM_ARTIFACT_BUCKET, Value: !Ref TerraformArtifacts}
          - {Name: TERRAFORM_STATE_KMS_KEY_ARN, Value: !GetAtt TerraformStateKey.Arn}
  BuildStateRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source: [aws.codebuild]
        detail-type: [CodeBuild Build State Change]
        detail:
          project-name: [!Ref TerraformProject]
          build-status: [SUCCEEDED,FAILED,FAULT,STOPPED,TIMED_OUT]
      Targets:
        - Arn: !GetAtt StatusFunction.Arn
          Id: ClusterStatus
  BuildStatePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StatusFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BuildStateRule.Arn
  ClusterIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiId
      IntegrationMethod: POST
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ClusterFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000
  ClusterInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ClusterFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/v1/*/api/v1/clusters*'
  CreateRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  ListRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/clusters
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  GetRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/clusters/{clusterId}
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  UpdateRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: PUT /api/v1/clusters/{clusterId}
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  SubmitRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters/{clusterId}/submit
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  ReviewRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters/{clusterId}/review
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  ApproveRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters/{clusterId}/approve
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  RejectRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters/{clusterId}/reject
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  PlanRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters/{clusterId}/plan
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  ApplyRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters/{clusterId}/apply
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
Outputs:
  FunctionName: {Value: !Ref ClusterFunction}
  TerraformProjectName: {Value: !Ref TerraformProject}
  TerraformArtifactBucket: {Value: !Ref TerraformArtifacts}
  TerraformStateKmsKeyArn: {Value: !GetAtt TerraformStateKey.Arn}
  TerraformExecutionRoleArn: {Value: !GetAtt TerraformRole.Arn}
