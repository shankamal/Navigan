AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Navigan Cluster Management API and asynchronous Terraform execution
Parameters:
  JwtScope: {Type: String, Default: navigan/api}
  DatabaseName: {Type: String}
  DatabaseProxyHost: {Type: String}
  ApiDatabaseSecretArn: {Type: String}
  SecretsKmsKeyArn: {Type: String}
  PrivateSubnetIds: {Type: List<AWS::EC2::Subnet::Id>}
  LambdaSecurityGroupIds: {Type: List<AWS::EC2::SecurityGroup::Id>}
  RdsCaLayerArn: {Type: String}
  ApiId: {Type: String}
  AuthorizerId: {Type: String}
  IdentityUserPoolId: {Type: String}
  TerraformRunnerImageUri: {Type: String}
  ConnectorImageUri: {Type: String, Default: ''}
  GitHubAppId: {Type: String, Default: ''}
  GitHubAppSlug: {Type: String, Default: ''}
  GitHubAppPrivateKeySecretArn: {Type: String, Default: ''}
  PlatformToolsBaseUrl:
    Type: String
    Default: ''
    Description: Environment-specific shared tools base URL, for example https://dev.navigan.click/tools
  PlatformToolsGatewayEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  PlatformToolsTunnelEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 30
    MemorySize: 256
    CodeUri: ../../../src/
    Layers: [!Ref RdsCaLayerArn]
    VpcConfig:
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds: !Ref LambdaSecurityGroupIds
    Environment:
      Variables:
        DB_PROXY_HOST: !Ref DatabaseProxyHost
        DB_NAME: !Ref DatabaseName
        DB_CA_BUNDLE: /opt/certs/global-bundle.pem
        DB_SECRET_ARN: !Ref ApiDatabaseSecretArn
        TERRAFORM_ARTIFACT_BUCKET: !Ref TerraformArtifacts
        TERRAFORM_STATE_KMS_KEY_ARN: !GetAtt TerraformStateKey.Arn
Conditions:
  HasGitHubAppPrivateKey: !Not [!Equals [!Ref GitHubAppPrivateKeySecretArn, '']]
Resources:
  ConnectorRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain the newest 20 connector images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": {"type": "expire"}
              }
            ]
          }
  TerraformStateKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      Description: Navigan Terraform state and immutable plan artifacts
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: RootAdministration
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: 'kms:*'
            Resource: '*'
  TerraformArtifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt TerraformStateKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  TerraformArtifactsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformArtifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt TerraformArtifacts.Arn, !Sub '${TerraformArtifacts.Arn}/*']
            Condition: {Bool: {aws:SecureTransport: 'false'}}
  ClusterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: navigan.modules.cluster_management.handler.lambda_handler
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          TERRAFORM_CODEBUILD_PROJECT: !Ref TerraformProject
          IDENTITY_USER_POOL_ID: !Ref IdentityUserPoolId
          CONNECTOR_IMAGE_URI: !Ref ConnectorImageUri
          CONNECTOR_API_BASE_URL: !Sub 'https://${ApiId}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/api/v1'
          GITHUB_APP_ID: !Ref GitHubAppId
          GITHUB_APP_SLUG: !Ref GitHubAppSlug
          GITHUB_APP_PRIVATE_KEY_SECRET_ARN: !Ref GitHubAppPrivateKeySecretArn
          PLATFORM_TOOLS_BASE_URL: !Ref PlatformToolsBaseUrl
          PLATFORM_TOOLS_GATEWAY_ENABLED: !Ref PlatformToolsGatewayEnabled
          PLATFORM_TOOLS_TUNNEL_ENABLED: !Ref PlatformToolsTunnelEnabled
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref ApiDatabaseSecretArn
                - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:navigan/provisioning/*'
                - !If
                  - HasGitHubAppPrivateKey
                  - !Ref GitHubAppPrivateKeySecretArn
                  - !Ref AWS::NoValue
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Ref SecretsKmsKeyArn
            - Effect: Allow
              Action: [s3:GetObject,s3:PutObject]
              Resource: !Sub '${TerraformArtifacts.Arn}/*'
            - Effect: Allow
              Action: [kms:GenerateDataKey, kms:Decrypt]
              Resource: !GetAtt TerraformStateKey.Arn
            - Effect: Allow
              Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
              Resource: !GetAtt TerraformProject.Arn
            - Effect: Allow
              Action: sts:AssumeRole
              Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/NaviganProvisioningRole'
            - Effect: Allow
              Action: logs:GetLogEvents
              Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${TerraformProject}:log-stream:*'
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListGroups
                - cognito-idp:AdminGetUser
                - cognito-idp:GetGroup
              Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${IdentityUserPoolId}'
  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: navigan.modules.cluster_management.status_handler.lambda_handler
      Timeout: 120
      Environment:
        Variables:
          CONNECTOR_IMAGE_URI: !Ref ConnectorImageUri
          CONNECTOR_API_BASE_URL: !Sub 'https://${ApiId}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/api/v1'
          GITHUB_APP_ID: !Ref GitHubAppId
          GITHUB_APP_PRIVATE_KEY_SECRET_ARN: !Ref GitHubAppPrivateKeySecretArn
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref ApiDatabaseSecretArn
                - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:navigan/provisioning/*'
                - !If
                  - HasGitHubAppPrivateKey
                  - !Ref GitHubAppPrivateKeySecretArn
                  - !Ref AWS::NoValue
            - Effect: Allow
              Action: kms:Decrypt
              Resource: [!Ref SecretsKmsKeyArn, !GetAtt TerraformStateKey.Arn]
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${TerraformArtifacts.Arn}/*'
            - Effect: Allow
              Action: sts:AssumeRole
              Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/NaviganProvisioningRole'
  ConnectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: navigan.modules.cluster_management.connector_handler.lambda_handler
      ReservedConcurrentExecutions: 10
      Timeout: 15
      Environment:
        Variables:
          GITHUB_APP_ID: !Ref GitHubAppId
          GITHUB_APP_PRIVATE_KEY_SECRET_ARN: !Ref GitHubAppPrivateKeySecretArn
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref ApiDatabaseSecretArn
                - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:navigan/provisioning/*'
                - !If
                  - HasGitHubAppPrivateKey
                  - !Ref GitHubAppPrivateKeySecretArn
                  - !Ref AWS::NoValue
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Ref SecretsKmsKeyArn
  ToolSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: navigan.modules.cluster_management.tool_session_handler.lambda_handler
      ReservedConcurrentExecutions: 20
      Timeout: 10
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref ApiDatabaseSecretArn
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Ref SecretsKmsKeyArn
  TerraformRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TerraformExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup,logs:CreateLogStream,logs:PutLogEvents]
                Resource: '*'
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken,ecr:BatchCheckLayerAvailability,ecr:GetDownloadUrlForLayer,ecr:BatchGetImage]
                Resource: '*'
              - Effect: Allow
                Action: [s3:GetObject,s3:PutObject,s3:ListBucket,s3:DeleteObject]
                Resource: [!GetAtt TerraformArtifacts.Arn, !Sub '${TerraformArtifacts.Arn}/*']
              - Effect: Allow
                Action: [kms:Decrypt,kms:Encrypt,kms:GenerateDataKey,kms:DescribeKey]
                Resource: [!GetAtt TerraformStateKey.Arn, !Ref SecretsKmsKeyArn]
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:navigan/provisioning/*'
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/NaviganProvisioningRole'
  TerraformProject:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt TerraformRole.Arn
      TimeoutInMinutes: 90
      QueuedTimeoutInMinutes: 30
      Artifacts: {Type: NO_ARTIFACTS}
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - /opt/venv/bin/python /app/runner.py
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref TerraformRunnerImageUri
        ImagePullCredentialsType: SERVICE_ROLE
        PrivilegedMode: false
        EnvironmentVariables:
          - {Name: TERRAFORM_ARTIFACT_BUCKET, Value: !Ref TerraformArtifacts}
          - {Name: TERRAFORM_STATE_KMS_KEY_ARN, Value: !GetAtt TerraformStateKey.Arn}
  BuildStateRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source: [aws.codebuild]
        detail-type: [CodeBuild Build State Change]
        detail:
          project-name: [!Ref TerraformProject]
          build-status: [SUCCEEDED,FAILED,FAULT,STOPPED,TIMED_OUT]
      Targets:
        - Arn: !GetAtt StatusFunction.Arn
          Id: ClusterStatus
  BuildStatePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StatusFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BuildStateRule.Arn
  ClusterIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiId
      IntegrationMethod: POST
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ClusterFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000
  ConnectorIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiId
      IntegrationMethod: POST
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ConnectorFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 14000
  ToolSessionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiId
      IntegrationMethod: POST
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ToolSessionFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 9000
  ClusterInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ClusterFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/v1/*/api/v1/clusters*'
  ConnectorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConnectorFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/v1/*/api/v1/connectors/*'
  ToolSessionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ToolSessionFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/v1/POST/api/v1/tool-sessions/*'
  CreateRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  ListRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/clusters
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  GetRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/clusters/{clusterId}
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  ExecutionLogsRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/clusters/{clusterId}/execution-logs
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  IdentityRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/clusters/{clusterId}/identity
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  KubernetesAccessRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/clusters/{clusterId}/access
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  KubernetesAccessSubjectsRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/clusters/{clusterId}/access/subjects
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  KubernetesAccessNamespacesRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/clusters/{clusterId}/access/namespaces
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  InstallConnectorRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters/{clusterId}/connector/install
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  ListNodeGroupRequestsRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/clusters/{clusterId}/node-groups
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  CreateNodeGroupRequestRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters/{clusterId}/node-groups
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  MigrateSystemNodeGroupRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters/{clusterId}/migrate-system-node-group
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  NodeGroupRequestActionRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters/{clusterId}/node-groups/{requestId}/{nodeGroupAction}
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  NodeGroupExecutionLogsRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/clusters/{clusterId}/node-groups/{requestId}/execution-logs
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  ClusterAuditLogRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/clusters/{clusterId}/audit-log
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  GetClusterPlatformComponentsRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/clusters/{clusterId}/platform-components
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  GetClusterToolsRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/clusters/{clusterId}/tools
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  CreateClusterToolSessionRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters/{clusterId}/tools/{toolCode}/sessions
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  ReportConnectorNamespacesRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ConnectorInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/connectors/{connectorId}/inventory/namespaces
      Target: !Join ['/', [integrations, !Ref ConnectorIntegration]]
      AuthorizationType: NONE
  ReportConnectorPlatformComponentsRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ConnectorInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/connectors/{connectorId}/inventory/platform-components
      Target: !Join ['/', [integrations, !Ref ConnectorIntegration]]
      AuthorizationType: NONE
  GetConnectorDesiredAccessRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ConnectorInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/connectors/{connectorId}/access/desired
      Target: !Join ['/', [integrations, !Ref ConnectorIntegration]]
      AuthorizationType: NONE
  ReportConnectorAccessStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ConnectorInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/connectors/{connectorId}/access/status
      Target: !Join ['/', [integrations, !Ref ConnectorIntegration]]
      AuthorizationType: NONE
  GetConnectorGitHubCredentialsRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ConnectorInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/connectors/{connectorId}/github/credentials
      Target: !Join ['/', [integrations, !Ref ConnectorIntegration]]
      AuthorizationType: NONE
  AuthorizeConnectorToolsRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ConnectorInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: GET /api/v1/connectors/{connectorId}/tools/authorize
      Target: !Join ['/', [integrations, !Ref ConnectorIntegration]]
      AuthorizationType: NONE
  ReportConnectorToolsStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ConnectorInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/connectors/{connectorId}/tools/status
      Target: !Join ['/', [integrations, !Ref ConnectorIntegration]]
      AuthorizationType: NONE
  ExchangeToolSessionRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ToolSessionInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/tool-sessions/{sessionId}/exchange
      Target: !Join ['/', [integrations, !Ref ToolSessionIntegration]]
      AuthorizationType: NONE
  ValidateToolSessionRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ToolSessionInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/tool-sessions/{sessionId}/validate
      Target: !Join ['/', [integrations, !Ref ToolSessionIntegration]]
      AuthorizationType: NONE
  CreateKubernetesAccessRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters/{clusterId}/access/assignments
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  RevokeKubernetesAccessRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: POST /api/v1/clusters/{clusterId}/access/assignments/{assignmentId}/revoke
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [!Ref JwtScope]
  UpdateRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ClusterInvokePermission
    Properties:
      ApiId: !Ref ApiId
      RouteKey: PUT /api/v1/clusters/{clusterId}
      Target: !Join ['/', [integrations, !Ref ClusterIntegration]]
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
