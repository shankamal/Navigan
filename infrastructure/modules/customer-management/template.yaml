      ApiId:
        Ref: ApiId
      RouteKey: POST /api/v1/customers/{customerId}/submit
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: CustomerIntegration
      AuthorizationType: JWT
      AuthorizerId:
        Ref: AuthorizerId
      AuthorizationScopes:
      - Ref: JwtScope
  ResubmitCustomerRoute:
