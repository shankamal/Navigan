      ApiId:
        Ref: ApiId
      RouteKey: PUT /api/v1/customers/{customerId}/cloud-providers
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: CustomerIntegration
      AuthorizationType: JWT
      AuthorizerId:
        Ref: AuthorizerId
      AuthorizationScopes:
      - Ref: JwtScope
  SubmitCustomerRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
    - CustomerInvokePermission
