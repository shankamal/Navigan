Outputs:
  CustomerFunctionArn:
    Value:
      Fn::GetAtt:
      - CustomerFunction
      - Arn
  OutboxPublisherFunctionName:
    Value:
      Ref: OutboxPublisher
  NotificationQueueUrl:
    Value:
      Ref: NotificationQueue
