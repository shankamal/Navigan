      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: EnvironmentIntegration
      AuthorizationType: JWT
      AuthorizerId:
        Ref: AuthorizerId
      AuthorizationScopes:
      - Ref: JwtScope
  ReviewEnvironmentRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
    - EnvironmentInvokePermission
    Properties:
      ApiId:
        Ref: ApiId
      RouteKey: POST /api/v1/environments/{environmentId}/review
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: EnvironmentIntegration
      AuthorizationType: JWT
