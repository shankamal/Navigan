      AuthorizationScopes:
      - Ref: JwtScope
  ApproveEnvironmentRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
    - EnvironmentInvokePermission
    Properties:
      ApiId:
        Ref: ApiId
      RouteKey: POST /api/v1/environments/{environmentId}/approve
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: EnvironmentIntegration
      AuthorizationType: JWT
