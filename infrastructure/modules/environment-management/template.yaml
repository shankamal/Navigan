  ActivateEnvironmentRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
    - EnvironmentInvokePermission
    Properties:
      ApiId:
        Ref: ApiId
      RouteKey: POST /api/v1/environments/{environmentId}/activate
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: EnvironmentIntegration
      AuthorizationType: JWT
