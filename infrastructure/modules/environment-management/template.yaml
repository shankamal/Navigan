    Properties:
      ApiId:
        Ref: ApiId
      RouteKey: POST /api/v1/environments/{environmentId}/deactivate
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: EnvironmentIntegration
      AuthorizationType: JWT
      AuthorizerId:
        Ref: AuthorizerId
      AuthorizationScopes:
      - Ref: JwtScope
  EnvironmentDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: EnvironmentFunction
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 25000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
Outputs:
  FunctionName:
    Value:
      Ref: EnvironmentFunction
