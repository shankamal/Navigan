AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Runtime: python3.12
    Architectures:
    - x86_64
    Timeout: 30
    MemorySize: 256
    CodeUri: ../../../src/
    Layers:
    - Ref: RdsCaLayerArn
    VpcConfig:
      SubnetIds:
        Ref: PrivateSubnetIds
      SecurityGroupIds:
        Ref: LambdaSecurityGroupIds
    Environment:
      Variables:
        DB_PROXY_HOST:
          Ref: DatabaseProxyHost
        DB_NAME:
          Ref: DatabaseName
        DB_CA_BUNDLE: /opt/certs/global-bundle.pem
Description: 'Navigan Environment Management: provider-aware API, JWT routes and diagnostics'
Parameters:
  JwtScope:
    Type: String
    Default: navigan/api
  DatabaseName:
    Type: String
    Default: navigan
  DatabaseProxyHost:
    Type: String
  ApiDatabaseSecretArn:
    Type: String
  SecretsKmsKeyArn:
    Type: String
    Description: KMS key encrypting the two database Secrets Manager secrets
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LambdaSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  RdsCaLayerArn:
    Type: String
    Description: Layer containing the official RDS CA bundle at /opt/certs/global-bundle.pem
  ApiId:
    Type: String
  AuthorizerId:
    Type: String
Resources:
  EnvironmentFunction:
    Properties:
      Environment:
        Variables:
          DB_SECRET_ARN:
            Ref: ApiDatabaseSecretArn
      Handler: navigan.modules.environment_management.handler.lambda_handler
      Policies:
      - AWSLambdaVPCAccessExecutionRole
      - Statement:
        - Action: secretsmanager:GetSecretValue
          Effect: Allow
          Resource:
            Ref: ApiDatabaseSecretArn
        - Action: kms:Decrypt
          Effect: Allow
          Resource:
            Ref: SecretsKmsKeyArn
      ReservedConcurrentExecutions: 20
    Type: AWS::Serverless::Function
  EnvironmentLogs:
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${EnvironmentFunction}
      RetentionInDays: 30
    Type: AWS::Logs::LogGroup
  EnvironmentIntegration:
    Properties:
      ApiId:
        Ref: ApiId
      IntegrationMethod: POST
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::GetAtt:
        - EnvironmentFunction
        - Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000
    Type: AWS::ApiGatewayV2::Integration
  EnvironmentInvokePermission:
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: EnvironmentFunction
      Principal: apigateway.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
      SourceArn:
        Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/v1/*/api/v1/environments*
    Type: AWS::Lambda::Permission
  CreateEnvironmentRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
    - EnvironmentInvokePermission
    Properties:
      ApiId:
        Ref: ApiId
      RouteKey: POST /api/v1/environments
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: EnvironmentIntegration
      AuthorizationType: JWT
      AuthorizerId:
        Ref: AuthorizerId
      AuthorizationScopes:
      - Ref: JwtScope
  ListEnvironmentRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
    - EnvironmentInvokePermission
    Properties:
      ApiId:
        Ref: ApiId
      RouteKey: GET /api/v1/environments
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: EnvironmentIntegration
      AuthorizationType: JWT
      AuthorizerId:
        Ref: AuthorizerId
      AuthorizationScopes:
      - Ref: JwtScope
  GetEnvironmentRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
    - EnvironmentInvokePermission
    Properties:
      ApiId:
        Ref: ApiId
      RouteKey: GET /api/v1/environments/{environmentId}
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: EnvironmentIntegration
      AuthorizationType: JWT
      AuthorizerId:
        Ref: AuthorizerId
      AuthorizationScopes:
      - Ref: JwtScope
  UpdateEnvironmentRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
    - EnvironmentInvokePermission
    Properties:
      ApiId:
        Ref: ApiId
      RouteKey: PUT /api/v1/environments/{environmentId}
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: EnvironmentIntegration
      AuthorizationType: JWT
      AuthorizerId:
        Ref: AuthorizerId
      AuthorizationScopes:
      - Ref: JwtScope
  MetadataEnvironmentRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
    - EnvironmentInvokePermission
    Properties:
      ApiId:
        Ref: ApiId
      RouteKey: GET /api/v1/environments/metadata
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: EnvironmentIntegration
      AuthorizationType: JWT
      AuthorizerId:
        Ref: AuthorizerId
      AuthorizationScopes:
      - Ref: JwtScope
  SchemaEnvironmentRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
    - EnvironmentInvokePermission
    Properties:
      ApiId:
        Ref: ApiId
      RouteKey: GET /api/v1/environments/configuration-schemas/{distribution}/{schemaVersion}
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: EnvironmentIntegration
      AuthorizationType: JWT
      AuthorizerId:
        Ref: AuthorizerId
      AuthorizationScopes:
      - Ref: JwtScope
  HistoryEnvironmentRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
    - EnvironmentInvokePermission
    Properties:
      ApiId:
        Ref: ApiId
      RouteKey: GET /api/v1/environments/{environmentId}/status-history
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: EnvironmentIntegration
      AuthorizationType: JWT
      AuthorizerId:
        Ref: AuthorizerId
      AuthorizationScopes:
      - Ref: JwtScope
  VersionsEnvironmentRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
    - EnvironmentInvokePermission
    Properties:
      ApiId:
        Ref: ApiId
      RouteKey: GET /api/v1/environments/{environmentId}/versions
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: EnvironmentIntegration
      AuthorizationType: JWT
      AuthorizerId:
        Ref: AuthorizerId
      AuthorizationScopes:
      - Ref: JwtScope
  VersionEnvironmentRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
    - EnvironmentInvokePermission
    Properties:
      ApiId:
        Ref: ApiId
      RouteKey: GET /api/v1/environments/{environmentId}/versions/{version}
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: EnvironmentIntegration
      AuthorizationType: JWT
      AuthorizerId:
        Ref: AuthorizerId
      AuthorizationScopes:
      - Ref: JwtScope
  ReviewsEnvironmentRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
    - EnvironmentInvokePermission
    Properties:
      ApiId:
        Ref: ApiId
      RouteKey: GET /api/v1/environments/{environmentId}/reviews
      Target:
