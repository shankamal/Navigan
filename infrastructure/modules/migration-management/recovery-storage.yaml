AWSTemplateFormatVersion: '2010-09-09'
Description: Private source artifact recovery storage; does not grant source node access
Parameters:
  MigrationFunctionRoleName:
    Type: String
    AllowedPattern: '[A-Za-z0-9+=,.@_-]+'
Resources:
  RecoveryBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRecoveryArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration: {NoncurrentDays: 7}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  RecoveryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RecoveryBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt RecoveryBucket.Arn, !Sub '${RecoveryBucket.Arn}/*']
            Condition: {Bool: {aws:SecureTransport: false}}
  RecoveryStoragePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: NaviganSourceArtifactRecoveryStorage
      Roles: [!Ref MigrationFunctionRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [s3:PutObject, s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub '${RecoveryBucket.Arn}/customers/*/migrations/*/recovery/*'
Outputs:
  RecoveryBucketName: {Value: !Ref RecoveryBucket}
