AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Navigan parent stack: shared platform and separate module CloudFormation stacks'
Parameters:
  JwtIssuer:
    Type: String
  JwtAudience:
    Type: String
  JwtScope:
    Type: String
    Default: navigan/api
  DatabaseName:
    Type: String
    Default: navigan
  DatabaseProxyHost:
    Type: String
  ApiDatabaseSecretArn:
    Type: String
  EventsDatabaseSecretArn:
    Type: String
  SecretsKmsKeyArn:
    Type: String
    Description: KMS key encrypting the two database Secrets Manager secrets
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LambdaSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  RdsCaLayerArn:
    Type: String
    Description: Layer containing the official RDS CA bundle at /opt/certs/global-bundle.pem
  OutboxScheduleEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
    Description: Set false during migration until the previous publisher has been stopped.
Resources:
  SharedPlatform:
    Type: AWS::Serverless::Application
    Properties:
      Location: shared/template.yaml
      Parameters:
        JwtIssuer:
          Ref: JwtIssuer
        JwtAudience:
          Ref: JwtAudience
  CustomerManagement:
    Type: AWS::Serverless::Application
    Properties:
      Location: modules/customer-management/template.yaml
      Parameters:
        JwtScope:
          Ref: JwtScope
        DatabaseName:
          Ref: DatabaseName
        DatabaseProxyHost:
          Ref: DatabaseProxyHost
        ApiDatabaseSecretArn:
          Ref: ApiDatabaseSecretArn
        EventsDatabaseSecretArn:
          Ref: EventsDatabaseSecretArn
        SecretsKmsKeyArn:
          Ref: SecretsKmsKeyArn
        PrivateSubnetIds:
          Fn::Join:
          - ','
          - Ref: PrivateSubnetIds
        LambdaSecurityGroupIds:
          Fn::Join:
          - ','
          - Ref: LambdaSecurityGroupIds
        RdsCaLayerArn:
          Ref: RdsCaLayerArn
        OutboxScheduleEnabled:
          Ref: OutboxScheduleEnabled
        ApiId:
          Fn::GetAtt:
          - SharedPlatform
          - Outputs.ApiId
        AuthorizerId:
          Fn::GetAtt:
          - SharedPlatform
          - Outputs.AuthorizerId
        EventBusName:
          Fn::GetAtt:
          - SharedPlatform
          - Outputs.EventBusName
        EventBusArn:
          Fn::GetAtt:
          - SharedPlatform
          - Outputs.EventBusArn
Outputs:
  ApiId:
    Value:
      Fn::GetAtt:
      - SharedPlatform
      - Outputs.ApiId
  ApiBaseUrl:
    Value:
      Fn::GetAtt:
      - SharedPlatform
      - Outputs.ApiBaseUrl
  EventBusName:
    Value:
      Fn::GetAtt:
      - SharedPlatform
      - Outputs.EventBusName
  ApiUrl:
    Value:
      Fn::Sub: ${SharedPlatform.Outputs.ApiBaseUrl}/customers
  NotificationQueueUrl:
    Value:
      Fn::GetAtt:
      - CustomerManagement
      - Outputs.NotificationQueueUrl
  SharedPlatformStackId:
    Value:
      Ref: SharedPlatform
  CustomerManagementStackId:
    Value:
      Ref: CustomerManagement
  OutboxPublisherFunctionName:
    Value:
      Fn::GetAtt:
      - CustomerManagement
      - Outputs.OutboxPublisherFunctionName
