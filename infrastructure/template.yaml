AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Navigan modular API foundation and Customer Management module
Parameters:
  JwtIssuer:
    Type: String
  JwtAudience:
    Type: String
  JwtScope:
    Type: String
    Default: navigan/api
  DatabaseName:
    Type: String
    Default: navigan
  DatabaseProxyHost:
    Type: String
  ApiDatabaseSecretArn:
    Type: String
  EventsDatabaseSecretArn:
    Type: String
  SecretsKmsKeyArn:
    Type: String
    Description: KMS key encrypting the two database Secrets Manager secrets
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LambdaSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  RdsCaLayerArn:
    Type: String
    Description: Layer containing the official RDS CA bundle at /opt/certs/global-bundle.pem
Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 30
    MemorySize: 256
    CodeUri: ../src/
    Layers:
      - !Ref RdsCaLayerArn
    VpcConfig:
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds: !Ref LambdaSecurityGroupIds
    Environment:
      Variables:
        DB_PROXY_HOST: !Ref DatabaseProxyHost
        DB_NAME: !Ref DatabaseName
        DB_CA_BUNDLE: /opt/certs/global-bundle.pem
Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      Auth:
        DefaultAuthorizer: EnterpriseJwt
        Authorizers:
          EnterpriseJwt:
            IdentitySource: '$request.header.Authorization'
            AuthorizationScopes:
              - !Ref JwtScope
            JwtConfiguration:
              issuer: !Ref JwtIssuer
              audience:
                - !Ref JwtAudience
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogs.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency"}'
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30
  CustomerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: navigan.modules.customer_management.handler.lambda_handler
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          DB_SECRET_ARN: !Ref ApiDatabaseSecretArn
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref ApiDatabaseSecretArn
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Ref SecretsKmsKeyArn
      Events:
        CustomerRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/v1/customers
            Method: ANY
            PayloadFormatVersion: '2.0'
        CustomerRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/v1/customers/{proxy+}
            Method: ANY
            PayloadFormatVersion: '2.0'
  CustomerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CustomerFunction}
      RetentionInDays: 30
  DomainEvents:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub ${AWS::StackName}-domain-events
  OutboxPublisher:
    Type: AWS::Serverless::Function
    Properties:
      Handler: navigan.shared.outbox.lambda_handler
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          EVENTS_DB_SECRET_ARN: !Ref EventsDatabaseSecretArn
          EVENT_BUS_NAME: !Ref DomainEvents
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref EventsDatabaseSecretArn
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Ref SecretsKmsKeyArn
            - Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt DomainEvents.Arn
      Events:
        Poll:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true
  PublisherLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${OutboxPublisher}
      RetentionInDays: 30
  NotificationDeadLetters:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDeadLetters.Arn
        maxReceiveCount: 5
  NotificationRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref DomainEvents
      EventPattern:
        source: [navigan.customer-management]
        detail-type: [CustomerSubmitted, CustomerApproved, CustomerRejected]
      Targets:
        - Id: Notifications
          Arn: !GetAtt NotificationQueue.Arn
          DeadLetterConfig:
            Arn: !GetAtt NotificationDeadLetters.Arn
  NotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref NotificationQueue, !Ref NotificationDeadLetters]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: [!GetAtt NotificationQueue.Arn, !GetAtt NotificationDeadLetters.Arn]
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt NotificationRule.Arn
  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: Navigan/CustomerManagement
      MetricName: customer_api_errors_total
      Dimensions:
        - Name: Module
          Value: CustomerManagement
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  PublisherErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref OutboxPublisher
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  OutboxAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: Navigan/Events
      MetricName: OutboxOldestAge
      Dimensions:
        - Name: Module
          Value: CustomerManagement
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/v1/api/v1/customers
  EventBusName:
    Value: !Ref DomainEvents
  NotificationQueueUrl:
    Value: !Ref NotificationQueue
