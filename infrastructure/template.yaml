AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Navigan parent stack: shared platform and separate module CloudFormation
  stacks'
Parameters:
  JwtIssuer:
    Type: String
  JwtAudience:
    Type: String
  JwtScope:
    Type: String
    Default: navigan/api
  DatabaseName:
    Type: String
    Default: navigan
  DatabaseProxyHost:
    Type: String
  ApiDatabaseSecretArn:
    Type: String
  EventsDatabaseSecretArn:
    Type: String
  SecretsKmsKeyArn:
    Type: String
    Description: KMS key encrypting the two database Secrets Manager secrets
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LambdaSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  RdsCaLayerArn:
    Type: String
    Description: Layer containing the official RDS CA bundle at /opt/certs/global-bundle.pem
  OutboxScheduleEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
    Description: Set false during migration until the previous publisher has been
      stopped.
  TerraformRunnerImageUri:
    Type: String
    Description: Immutable ECR image URI for the Navigan Terraform runner
Resources:
  SharedPlatform:
    Type: AWS::Serverless::Application
    Properties:
      Location: shared/template.yaml
      Parameters:
        JwtIssuer:
          Ref: JwtIssuer
        JwtAudience:
          Ref: JwtAudience
  CustomerManagement:
    Type: AWS::Serverless::Application
    Properties:
      Location: modules/customer-management/template.yaml
      Parameters:
        JwtScope: &id001
          Ref: JwtScope
        DatabaseName: &id002
          Ref: DatabaseName
        DatabaseProxyHost: &id003
          Ref: DatabaseProxyHost
        ApiDatabaseSecretArn: &id004
          Ref: ApiDatabaseSecretArn
        EventsDatabaseSecretArn:
          Ref: EventsDatabaseSecretArn
        SecretsKmsKeyArn: &id005
          Ref: SecretsKmsKeyArn
        PrivateSubnetIds: &id006
          Fn::Join:
          - ','
          - Ref: PrivateSubnetIds
        LambdaSecurityGroupIds: &id007
          Fn::Join:
          - ','
          - Ref: LambdaSecurityGroupIds
        RdsCaLayerArn: &id008
          Ref: RdsCaLayerArn
        OutboxScheduleEnabled:
          Ref: OutboxScheduleEnabled
        ApiId: &id009
          Fn::GetAtt:
          - SharedPlatform
          - Outputs.ApiId
        AuthorizerId: &id010
          Fn::GetAtt:
          - SharedPlatform
          - Outputs.AuthorizerId
        EventBusName:
          Fn::GetAtt:
          - SharedPlatform
          - Outputs.EventBusName
        EventBusArn:
          Fn::GetAtt:
          - SharedPlatform
          - Outputs.EventBusArn
  EnvironmentManagement:
    Type: AWS::Serverless::Application
    Properties:
      Location: modules/environment-management/template.yaml
      Parameters:
        JwtScope: *id001
        DatabaseName: *id002
        DatabaseProxyHost: *id003
        ApiDatabaseSecretArn: *id004
        SecretsKmsKeyArn: *id005
        PrivateSubnetIds: *id006
        LambdaSecurityGroupIds: *id007
        RdsCaLayerArn: *id008
        ApiId: *id009
        AuthorizerId: *id010
  ClusterManagement:
    Type: AWS::Serverless::Application
    Properties:
      Location: modules/cluster-management/template.yaml
      Parameters:
        JwtScope: *id001
        DatabaseName: *id002
        DatabaseProxyHost: *id003
        ApiDatabaseSecretArn: *id004
        SecretsKmsKeyArn: *id005
        PrivateSubnetIds: *id006
        LambdaSecurityGroupIds: *id007
        RdsCaLayerArn: *id008
        ApiId: *id009
        AuthorizerId: *id010
        TerraformRunnerImageUri:
          Ref: TerraformRunnerImageUri
Outputs:
  ApiId:
    Value:
      Fn::GetAtt:
      - SharedPlatform
      - Outputs.ApiId
  ApiBaseUrl:
    Value:
      Fn::GetAtt:
      - SharedPlatform
      - Outputs.ApiBaseUrl
  EventBusName:
    Value:
      Fn::GetAtt:
      - SharedPlatform
      - Outputs.EventBusName
  ApiUrl:
    Value:
      Fn::Sub: ${SharedPlatform.Outputs.ApiBaseUrl}/customers
  NotificationQueueUrl:
    Value:
      Fn::GetAtt:
      - CustomerManagement
      - Outputs.NotificationQueueUrl
  SharedPlatformStackId:
    Value:
      Ref: SharedPlatform
  CustomerManagementStackId:
    Value:
      Ref: CustomerManagement
  OutboxPublisherFunctionName:
    Value:
      Fn::GetAtt:
      - CustomerManagement
      - Outputs.OutboxPublisherFunctionName
  EnvironmentManagementStackId:
    Value:
      Ref: EnvironmentManagement
  EnvironmentFunctionName:
    Value:
      Fn::GetAtt:
      - EnvironmentManagement
      - Outputs.FunctionName
  ClusterManagementStackId:
    Value:
      Ref: ClusterManagement
  ClusterFunctionName:
    Value:
      Fn::GetAtt:
      - ClusterManagement
      - Outputs.FunctionName
  TerraformProjectName:
    Value:
      Fn::GetAtt:
      - ClusterManagement
      - Outputs.TerraformProjectName
  TerraformArtifactBucket:
    Value:
      Fn::GetAtt:
      - ClusterManagement
      - Outputs.TerraformArtifactBucket
  TerraformStateKmsKeyArn:
    Value:
      Fn::GetAtt:
      - ClusterManagement
      - Outputs.TerraformStateKmsKeyArn
  TerraformExecutionRoleArn:
    Value:
      Fn::GetAtt:
      - ClusterManagement
      - Outputs.TerraformExecutionRoleArn
