apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: navigan-connector
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: navigan-platform
spec:
  project: navigan-platform
  sources:
    - repoURL: __PLATFORM_REGISTRY__/helm
      chart: navigan-cluster-connector
      targetRevision: 0.1.0
      helm:
        releaseName: navigan-cluster-connector
        valueFiles:
          - $values/values/connector.yaml
    - repoURL: __SYSTEM_REPO_URL__
      targetRevision: __SYSTEM_REPO_REVISION__
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: navigan-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
