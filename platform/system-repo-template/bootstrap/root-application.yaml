apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: navigan-system
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: navigan-platform
  source:
    repoURL: __SYSTEM_REPO_URL__
    targetRevision: __SYSTEM_REPO_REVISION__
    path: applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

