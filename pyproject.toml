[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "navigan"
version = "0.1.0"
description = "Modular container management platform APIs for AWS Lambda"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]==3.2.10", "boto3==1.40.30", "pydantic==2.13.4"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.12", "PyYAML==6.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL database"]

[tool.ruff]
line-length = 110
