# Run from the repository root. Use an absolute --config-file path because
# SAM resolves relative config paths against the selected template directory.
# Never put passwords, access keys or JWT tokens in this file.
#
# Two named environments: `dev` (navigan-ashok-dev, database navigan_dev) and
# `prod` (navigan-custmanagement-cfnstk, database navigan, backs navigan.click).
# The bare/default config (no --config-env flag) is DELIBERATELY an alias for
# `dev` so an accidental `sam build && sam deploy` with no flag can never land
# on production. Deploying to production always requires the explicit
# `--config-env prod` flag on both build and deploy.
