# Runtime targets and parameters are explicit, private release inputs.
# Capture them with scripts/reconcile-sam.py; do not commit captured bindings.
# All profiles stage unexecuted change sets by default.
version = 0.1

[default.validate.parameters]
template_file = "infrastructure/template.yaml"
lint = true
[default.build.parameters]
template_file = "infrastructure/template.yaml"
use_container = true
parallel = true
[default.deploy.parameters]
template_file = ".aws-sam/build/template.yaml"
resolve_s3 = true
capabilities = "CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND"
confirm_changeset = true
no_execute_changeset = true
fail_on_empty_changeset = false

[dev.validate.parameters]
template_file = "infrastructure/template.yaml"
lint = true
[dev.build.parameters]
template_file = "infrastructure/template.yaml"
use_container = true
parallel = true
[dev.deploy.parameters]
template_file = ".aws-sam/build/template.yaml"
resolve_s3 = true
capabilities = "CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND"
confirm_changeset = true
no_execute_changeset = true
fail_on_empty_changeset = false
parameter_overrides = "DeploymentEnvironment=dev"

[prod.validate.parameters]
template_file = "infrastructure/template.yaml"
lint = true
[prod.build.parameters]
template_file = "infrastructure/template.yaml"
use_container = true
parallel = true
[prod.deploy.parameters]
template_file = ".aws-sam/build/template.yaml"
resolve_s3 = true
capabilities = "CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND"
confirm_changeset = true
no_execute_changeset = true
fail_on_empty_changeset = false
parameter_overrides = "DeploymentEnvironment=prod"
