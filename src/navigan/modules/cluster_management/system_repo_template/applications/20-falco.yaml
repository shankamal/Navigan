apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: navigan-falco
  namespace: argocd
spec:
  project: navigan-platform
  sources:
    - repoURL: https://falcosecurity.github.io/charts
      chart: falco
      targetRevision: 9.1.0
      helm:
        releaseName: navigan-falco
        valueFiles:
          - $values/values/falco.yaml
    - repoURL: __SYSTEM_REPO_URL__
      targetRevision: __SYSTEM_REPO_REVISION__
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: navigan-security
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
