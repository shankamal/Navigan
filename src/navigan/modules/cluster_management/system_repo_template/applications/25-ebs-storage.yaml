apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: navigan-ebs-storage
  namespace: argocd
spec:
  project: navigan-platform
  source:
    repoURL: __SYSTEM_REPO_URL__
    targetRevision: __SYSTEM_REPO_REVISION__
    path: storage-classes
  destination:
    server: https://kubernetes.default.svc
    namespace: navigan-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
