apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: navigan-system
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: __SYSTEM_REPO_URL__
    targetRevision: __SYSTEM_REPO_REVISION__
    path: applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions: [CreateNamespace=true, PruneLast=true, ServerSideApply=true]
